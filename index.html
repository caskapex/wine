  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;

  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 2px; letter-spacing: -0.01em; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin: 0 0 22px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .stat .label { font-size: 11.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .stat .value { font-size: 21px; font-weight: 650; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  input[type="search"] {
    flex: 1; min-width: 180px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px;
  }
  input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chip {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-dim); font-size: 12.5px; cursor: pointer;
    white-space: nowrap; user-select: none;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-dim); padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
    white-space: nowrap;
  }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--accent); }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.group-row { cursor: pointer; }
  tbody tr.group-row:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  tbody tr.detail-row { background: color-mix(in srgb, var(--accent) 3%, transparent); display: none; }
  tbody tr.detail-row.show { display: table-row; }
  tbody tr.detail-row td { padding: 6px 12px 6px 32px; font-size: 13px; }
  .expand-toggle { display: inline-block; width: 16px; margin-right: 4px; font-size: 11px; user-select: none; }
  .wine-name { font-weight: 600; }
  .wine-sub { color: var(--text-dim); font-size: 12px; margin-top: 1px; }
  .location-col { font-size: 12px; color: var(--text-dim); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    color: #fff; white-space: nowrap;
  }
  .empty { text-align: center; color: var(--text-dim); padding: 40px 0; }
  .footer-note { color: var(--text-dim); font-size: 11.5px; margin-top: 18px; text-align: center; }
</style>
</head>

  'Unknown': 'var(--gray)',
};

const fmtUSD = (n) => n == null ? '—' : new Intl.NumberFormat('en-US', {style:'currency', currency:'USD', maximumFractionDigits: 0}).format(n);
const fmtWindow = (ws, we) => {
  if (ws == null && we == null) return '—';
  if (ws == null) return `≤ ${we}`;
  if (we == null) return `${ws} →`;
  return `${ws}–${we}`;
};

let sortKey = 'n';
let sortDir = 1;
let activeUrgency = null;

function computeStats(rows) {
  const totalBottles = rows.reduce((s, r) => s + r.q, 0);
  const totalValue = rows.reduce((s, r) => s + (r.val != null ? r.val * r.q : 0), 0);
  const counts = {};
  rows.forEach(r => counts[r.u] = (counts[r.u] || 0) + 1);
  return { totalBottles, totalValue, counts, wines: rows.length };
}

function renderStats() {
  const s = computeStats(RAW);
  const el = document.getElementById('stats');
  el.innerHTML = `
    <div class="stat"><div class="label">Distinct Wines</div><div class="value">${s.wines}</div></div>
    <div class="stat"><div class="label">Total Bottles</div><div class="value">${s.totalBottles}</div></div>
    <div class="stat"><div class="label">Drink Now</div><div class="value" style="color:${URGENCY_COLOR['Drink Now']}">${s.counts['Drink Now'] || 0}</div></div>
    <div class="stat"><div class="label">Past Window</div><div class="value" style="color:${URGENCY_COLOR['Past Window']}">${s.counts['Past Window'] || 0}</div></div>
  `;
}

function renderChips() {
  const order = ['Drink Now', 'Approaching', 'Aging Well', 'Past Window', 'Unknown'];
  const el = document.getElementById('urgencyChips');
  el.innerHTML = order.map(u =>
    `<div class="chip" data-u="${u}">${u}</div>`
  ).join('');
  el.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const u = chip.dataset.u;
      activeUrgency = activeUrgency === u ? null : u;
      render();
    });
  });
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let rows = RAW.filter(r => {
    const matchesSearch = !q || r.n.toLowerCase().includes(q) || (r.p || '').toLowerCase().includes(q) || (r.r || '').toLowerCase().includes(q);
    const matchesUrgency = !activeUrgency || r.u === activeUrgency;
    return matchesSearch && matchesUrgency;
  });

  // Add total property and sort
  rows = rows.map(r => ({...r, total: r.val != null ? r.val * r.q : null}));
  rows.sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
    return (av - bv) * sortDir;
  });

  document.querySelectorAll('#urgencyChips .chip').forEach(c => {
    c.classList.toggle('active', c.dataset.u === activeUrgency);
  });
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === sortKey);
  });

  const tbody = document.getElementById('rows');
  document.getElementById('emptyMsg').style.display = rows.length ? 'none' : 'block';

  let html = '';
  const rowId = (r, idx) => `wine-${idx}`;

  rows.forEach((r, idx) => {
    const id = rowId(r, idx);

    html += `
    <tr class="group-row" data-wine-id="${id}">
      <td>
        <span class="expand-toggle">▶</span>
        <div class="wine-name">${escapeHtml(r.n)}</div>
        <div class="wine-sub">${escapeHtml([r.p, r.r].filter(Boolean).join(' · '))}</div>
      </td>
      <td class="num">${r.v != null ? r.v : 'N.V.'}</td>
      <td class="num">${r.q}</td>
      <td>${fmtWindow(r.ws, r.we)}</td>
      <td><span class="badge" style="background:${URGENCY_COLOR[r.u] || 'var(--gray)'}">${r.u}</span></td>
      <td class="num">${fmtUSD(r.val)}</td>
      <td class="num">${fmtUSD(r.total)}</td>
    </tr>`;

    // Add detail rows for each location
    if (r.locations) {
      r.locations.forEach(loc => {
        const cellarDisplay = loc.cellar || 'Unknown';
        const locationDisplay = loc.location || '—';
        html += `
    <tr class="detail-row" data-wine-id="${id}">
      <td colspan="2"><span class="location-col"><strong>${escapeHtml(cellarDisplay)}</strong> / ${escapeHtml(locationDisplay)}</span></td>
      <td class="num"><span class="location-col">${loc.qty}</span></td>
      <td colspan="4"></td>
    </tr>`;
      });
    }
  });

  tbody.innerHTML = html;

  // Attach click handlers for expansion
  document.querySelectorAll('tr.group-row').forEach(row => {
    row.addEventListener('click', () => {
      const wineId = row.dataset.wineId;
      const toggle = row.querySelector('.expand-toggle');
      const detailRows = document.querySelectorAll(`tr.detail-row[data-wine-id="${wineId}"]`);

      if (detailRows.length === 0) return; // No detail rows to toggle

      const isExpanded = detailRows[0]?.classList.contains('show');
      detailRows.forEach(r => r.classList.toggle('show', !isExpanded));
      toggle.textContent = isExpanded ? '▶' : '▼';
    });
  });
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = 1; }
    render();
  });
});
document.getElementById('search').addEventListener('input', render);

renderStats();
renderChips();
render();
</script>
</body>
</html>
